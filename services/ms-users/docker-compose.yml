services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-users}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-users}
      POSTGRES_DB: ${POSTGRES_DB:-users}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10

  ms-users:
    build:
      context: ../..
      dockerfile: services/ms-users/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3002}
      DATABASE_URL: postgres://${POSTGRES_USER:-users}:${POSTGRES_PASSWORD:-users}@postgres:5432/${POSTGRES_DB:-users}?sslmode=disable
      OPENAPI_SPEC: /app/ms-users.yaml
    ports:
      - "${PORT:-3002}:${PORT:-3002}"

volumes:
  pgdata:
