openapi: 3.0.0
info:
  title: Microservice Users
  version: 1.0.0

servers:
  - url: http://localhost:3002
    description: Local

tags:
  - name: Users
    description: User registration and profile (JWT required except public signup).
  - name: Auth
    description: Authentication (JWT issuance).

paths:
  /auth:
    post:
      summary: Login
      description: |
        Authenticates with email and password. Returns a JWT (`access_token`) and the user profile.
        Soft-deleted users cannot authenticate. Invalid email or password yields 401 (same error shape).
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            examples:
              typical:
                summary: Typical login
                value:
                  user:
                    email: maria.silva@example.com
                    password: Str0ngP@ss!
      responses:
        '200':
          description: Authenticated; JWT and user profile (no password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  summary: Token and user
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                    user:
                      id: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                      first_name: Maria
                      last_name: Silva
                      email: maria.silva@example.com
        '400':
          description: Malformed JSON body.
          content:
            text/plain:
              schema:
                type: string
              example: invalid JSON body
        '401':
          description: Unknown email, wrong password, or inactive user.
          content:
            text/plain:
              schema:
                type: string
              example: invalid credentials
        '405':
          description: Method not allowed.
          content:
            text/plain:
              schema:
                type: string
                example: Method Not Allowed
        '500':
          description: Unexpected failure.
          content:
            text/plain:
              schema:
                type: string
                example: Internal Server Error

  /users:
    get:
      summary: List users
      description: |
        Returns all users that are not soft-deleted, ordered by `created_at` ascending.
        Passwords are never included. Requires a valid JWT. An empty JSON array is returned when there are no users.
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: JSON array of users (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsersResponse'
              examples:
                multiple:
                  summary: Two users
                  value:
                    - id: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                      first_name: Maria
                      last_name: Silva
                      email: maria@example.com
                    - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      first_name: João
                      last_name: Souza
                      email: joao@example.org
                empty:
                  summary: No users yet
                  value: []
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '405':
          description: Only `GET` and `POST` are allowed on this path.
          content:
            text/plain:
              schema:
                type: string
                example: Method Not Allowed
              examples:
                patchNotAllowed:
                  summary: PATCH on /users
                  value: Method Not Allowed
        '500':
          description: Unexpected failure (e.g. persistence error).
          content:
            text/plain:
              schema:
                type: string
                example: Internal Server Error
              examples:
                generic:
                  summary: Default server error text
                  value: Internal Server Error
    post:
      summary: Create user
      description: |
        Public signup. Creates a user. Names and email are trimmed; email is stored in lowercase.
        Password must be at least 8 characters (Unicode runes). The password is hashed with bcrypt;
        the API never returns the password or hash.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
            examples:
              typical:
                summary: Typical signup
                description: Common payload with mixed-case email (stored lowercase).
                value:
                  first_name: Maria
                  last_name: Silva
                  email: Maria.Silva@Example.com
                  password: Str0ngP@ss!
              trimmedFields:
                summary: Extra spaces on names
                description: Leading/trailing spaces on names are stripped before validation.
                value:
                  first_name: "  João  "
                  last_name: "  Souza "
                  email: joao@example.org
                  password: minimum8
      responses:
        '201':
          description: User created. `Location` points to the new resource (`/users/{id}`).
          headers:
            Location:
              description: URI of the created user (same origin path as the API).
              schema:
                type: string
                example: /users/6ba7b810-9dad-11d1-80b4-00c04fd430c8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
              examples:
                createdFromTypical:
                  summary: Response for typical signup
                  value:
                    id: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                    first_name: Maria
                    last_name: Silva
                    email: maria.silva@example.com
                createdFromTrimmed:
                  summary: Response after trimming names
                  value:
                    id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    first_name: João
                    last_name: Souza
                    email: joao@example.org
        '400':
          description: |
            Malformed JSON (`invalid JSON body`) or domain validation error
            (message usually includes the underlying reason, e.g. `create user: invalid email`).
          content:
            text/plain:
              schema:
                type: string
                example: "create user: invalid email"
              examples:
                invalidJson:
                  summary: Body is not valid JSON
                  value: "invalid JSON body"
                invalidEmail:
                  summary: Email fails validation
                  value: "create user: invalid email"
                passwordTooShort:
                  summary: Password shorter than 8 runes
                  value: "create user: password does not meet minimum length"
                emptyFirstName:
                  summary: Missing or blank first name
                  value: "create user: invalid first name"
        '409':
          description: Email already registered (unique constraint).
          content:
            text/plain:
              schema:
                type: string
                example: email already registered
              examples:
                duplicateEmail:
                  summary: Same email as an existing user
                  value: email already registered
        '405':
          description: Only `GET` and `POST` are allowed on this path.
          content:
            text/plain:
              schema:
                type: string
                example: Method Not Allowed
              examples:
                putNotAllowed:
                  summary: PUT on /users
                  value: Method Not Allowed
        '500':
          description: Unexpected failure (e.g. persistence error).
          content:
            text/plain:
              schema:
                type: string
                example: Internal Server Error
              examples:
                generic:
                  summary: Default server error text
                  value: Internal Server Error

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    get:
      summary: Get user by id
      description: |
        Returns a single user by UUID. Password is never included.
        The JWT subject (`sub`) must match `{id}` (users may only read their own profile).
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
              examples:
                found:
                  summary: Existing user
                  value:
                    id: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                    first_name: Maria
                    last_name: Silva
                    email: maria@example.com
        '400':
          description: Path `id` is not a valid UUID.
          content:
            text/plain:
              schema:
                type: string
                example: invalid user id
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Authenticated but not allowed to access this user.
          content:
            text/plain:
              schema:
                type: string
                example: forbidden
        '404':
          description: No active user with that id (or soft-deleted).
          content:
            text/plain:
              schema:
                type: string
                example: user not found
        '405':
          description: Only `GET`, `PATCH`, and `DELETE` are allowed on this path.
          content:
            text/plain:
              schema:
                type: string
                example: Method Not Allowed
        '500':
          description: Unexpected failure (e.g. persistence error).
          content:
            text/plain:
              schema:
                type: string
                example: Internal Server Error
              examples:
                generic:
                  summary: Default server error text
                  value: Internal Server Error
    patch:
      summary: Partially update user
      description: |
        Updates only fields present in the JSON body (omit a field to leave it unchanged).
        Same normalization and validation rules as create apply to provided fields.
        Password, when sent, must meet the minimum length; it is re-hashed with bcrypt before save.
        Sending an empty object (`{}`) is rejected (`no fields to update`).
        The JWT subject (`sub`) must match `{id}`.
      tags:
        - Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchRequest'
            examples:
              nameAndEmail:
                summary: Change first name and email
                value:
                  first_name: Ana
                  email: Ana@Example.com
              passwordOnly:
                summary: Rotate password only
                value:
                  password: newSecret12
              trimmedLastName:
                summary: Trimmed last name
                value:
                  last_name: "  Costa  "
              emptyBodyRejected:
                summary: Rejected by API (no fields)
                description: Results in 400 `no fields to update`.
                value: {}
      responses:
        '200':
          description: Updated user (password never returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
              examples:
                updated:
                  summary: After name and email patch
                  value:
                    id: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                    first_name: Ana
                    last_name: Silva
                    email: ana@example.com
        '400':
          description: |
            Malformed JSON, invalid path id, no fields in body, or domain validation error
            on a provided field (message often prefixed with `update user:`).
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalidJson:
                  summary: Body is not valid JSON
                  value: "invalid JSON body"
                invalidId:
                  summary: Path id is not a UUID
                  value: "invalid user id"
                noFields:
                  summary: Empty patch object
                  value: "no fields to update"
                invalidEmail:
                  summary: Email fails validation
                  value: "update user: invalid email"
                emptyFirstName:
                  summary: first_name sent as empty string
                  value: "update user: invalid first name"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Authenticated but not allowed to update this user.
          content:
            text/plain:
              schema:
                type: string
                example: forbidden
        '404':
          description: No active user with that id (or soft-deleted).
          content:
            text/plain:
              schema:
                type: string
                example: user not found
        '409':
          description: New email already used by another user.
          content:
            text/plain:
              schema:
                type: string
                example: email already registered
              examples:
                duplicateEmail:
                  summary: Unique email violation
                  value: email already registered
        '405':
          description: Only `GET`, `PATCH`, and `DELETE` are allowed on this path.
          content:
            text/plain:
              schema:
                type: string
                example: Method Not Allowed
        '500':
          description: Unexpected failure (e.g. persistence error).
          content:
            text/plain:
              schema:
                type: string
                example: Internal Server Error
              examples:
                generic:
                  summary: Default server error text
                  value: Internal Server Error
    delete:
      summary: Delete user (soft delete)
      description: |
        Soft-deletes the user (`deleted_at` set). The row remains for audit; the user no longer
        appears in list/get. Successful response has no body (`204 No Content`).
        The JWT subject must match `{id}`.
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '204':
          description: User soft-deleted.
        '400':
          description: Path `id` is not a valid UUID.
          content:
            text/plain:
              schema:
                type: string
                example: invalid user id
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Authenticated but not allowed to delete this user.
          content:
            text/plain:
              schema:
                type: string
                example: forbidden
        '404':
          description: No active user with that id.
          content:
            text/plain:
              schema:
                type: string
                example: user not found
        '405':
          description: Only `GET`, `PATCH`, and `DELETE` are allowed on this path.
          content:
            text/plain:
              schema:
                type: string
                example: Method Not Allowed
        '500':
          description: Unexpected failure (e.g. persistence error).
          content:
            text/plain:
              schema:
                type: string
                example: Internal Server Error
              examples:
                generic:
                  summary: Default server error text
                  value: Internal Server Error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserIdPath:
      name: id
      in: path
      required: true
      description: User UUID.
      schema:
        type: string
        format: uuid
        example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8

  responses:
    UnauthorizedError:
      description: Access token is missing or invalid

  schemas:
    UserRequest:
      type: object
      required:
        - first_name
        - last_name
        - password
        - email
      properties:
        first_name:
          type: string
          minLength: 1
          example: Maria
        last_name:
          type: string
          minLength: 1
          example: Silva
        password:
          type: string
          description: Minimum 8 Unicode characters.
          minLength: 8
          example: Str0ngP@ss!
        email:
          type: string
          format: email
          example: maria.silva@example.com
      example:
        first_name: Maria
        last_name: Silva
        email: maria.silva@example.com
        password: Str0ngP@ss!
    UserPatchRequest:
      type: object
      description: All properties optional; only sent fields are updated.
      properties:
        first_name:
          type: string
          description: If present, must be non-empty after trim (same rules as create).
          example: Ana
        last_name:
          type: string
          example: Costa
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          description: Minimum 8 Unicode characters; stored as bcrypt hash.
          minLength: 8
          example: newSecret12
      example:
        first_name: Ana
        email: ana@example.com
    UsersResponse:
      type: object
      required:
        - id
        - first_name
        - last_name
        - email
      properties:
        id:
          type: string
          format: uuid
          example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        first_name:
          type: string
          example: Maria
        last_name:
          type: string
          example: Silva
        email:
          type: string
          format: email
          example: maria.silva@example.com
      example:
        id: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        first_name: Maria
        last_name: Silva
        email: maria.silva@example.com
    AuthRequest:
      type: object
      required:
        - user
      properties:
        user:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
            password:
              type: string
          example:
            email: maria.silva@example.com
            password: Str0ngP@ss!
      example:
        user:
          email: maria.silva@example.com
          password: Str0ngP@ss!
    AuthResponse:
      type: object
      required:
        - access_token
        - user
      properties:
        access_token:
          type: string
          description: "JWT for `Authorization: Bearer <token>`."
        user:
          $ref: '#/components/schemas/UsersResponse'
      example:
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
        user:
          id: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
          first_name: Maria
          last_name: Silva
          email: maria.silva@example.com
