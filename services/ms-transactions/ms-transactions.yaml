openapi: 3.0.0
info:
  title: Microservice Wallet
  version: 1.0.0

servers:
  - url: http://localhost:3001
    description: Local

tags:
  - name: Transactions

paths:
  /transactions:
    post:
      summary: Create transaction
      description: |
        Creates a CREDIT or DEBIT for the authenticated user. `user_id` in the body must equal the JWT subject (`sub`).
        DEBIT is rejected with 422 when it would make the wallet balance negative.
        All monetary fields are **minor currency units** (integer, e.g. centavos for BRL); never floating-point.
        Optional header `Idempotency-Key` enables safe retries (see parameter description).
      tags:
        - Transactions
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            **Optional.** When sent (non-empty after trim), the server stores a mapping scoped to the authenticated user
            (`JWT sub`) and this key. Retrying the **same** request (same key and same `user_id`, `type`, `amount`) returns
            **201** again with the **same** transaction id and body (no second row in the ledger), matching common payment-API behavior.

            **Why optional:** aligns with public payment APIs (e.g. Stripe) that recommend idempotency keys for retries but do not
            break older clients; simple integrations may omit it; omitting the header keeps the previous behavior (each POST creates a new transaction).

            **Recommended:** clients that retry `POST` after timeouts or network errors should send a **stable** key per logical
            operation (e.g. a UUID generated once per user action).

            Max length: **255 Unicode code points**. Longer values yield **400**.

            Reusing the same key with a **different** body (different `user_id` / `type` / `amount`) for the same user yields **409 Conflict**.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transactions'
      responses:
        '201':
          description: |
            Transaction created, or idempotent replay of a prior successful create with the same `Idempotency-Key` and body.
            Optional `Location` header `/transactions/{id}`.
          headers:
            Location:
              schema:
                type: string
                example: /transactions/6ba7b810-9dad-11d1-80b4-00c04fd430c8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsModel'
        '400':
          description: Malformed JSON or validation error (invalid UUID, invalid type, amount not positive).
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalidJson:
                  value: invalid JSON body
                invalidUserId:
                  value: invalid user id
                invalidType:
                  value: invalid transaction type
                invalidAmount:
                  value: amount must be positive
                idempotencyKeyTooLong:
                  value: idempotency key exceeds maximum length
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Body `user_id` does not match JWT subject.
          content:
            text/plain:
              schema:
                type: string
              example: user_id must match JWT subject
        '405':
          description: Method not allowed.
          content:
            text/plain:
              schema:
                type: string
              example: Method Not Allowed
        '422':
          description: DEBIT would exceed available balance.
          content:
            text/plain:
              schema:
                type: string
              example: insufficient balance
        '409':
          description: Same `Idempotency-Key` for this user with a different request body.
          content:
            text/plain:
              schema:
                type: string
              example: idempotency key reused with a different request body
        '500':
          description: Unexpected failure.
          content:
            text/plain:
              schema:
                type: string
              example: Internal Server Error
    get:
      summary: List transactions
      description: |
        Returns transactions for the JWT subject only, ordered by `created_at` ascending.
        Optional query `type` filters by CREDIT or DEBIT (must match enum case).
      tags:
        - Transactions
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          required: false
          description: Filter by CREDIT or DEBIT (case-sensitive).
          schema:
            type: string
            enum:
              - CREDIT
              - DEBIT
      responses:
        '200':
          description: OK (JSON array; may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionsModel'
        '400':
          description: Invalid `type` query parameter.
          content:
            text/plain:
              schema:
                type: string
              example: invalid transaction type filter
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '405':
          description: Method not allowed.
          content:
            text/plain:
              schema:
                type: string
              example: Method Not Allowed
        '500':
          description: Unexpected failure.
          content:
            text/plain:
              schema:
                type: string
              example: Internal Server Error
  /balance:
    get:
      summary: Wallet balance
      description: |
        Consolidated balance from all CREDIT and DEBIT rows for the JWT subject, computed with SQL
        `SUM` and `CASE` (credits add, debits subtract). Returned `amount` is in **minor currency units**
        (same scale as transaction amounts).
      tags:
        - Transactions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '405':
          description: Method not allowed.
          content:
            text/plain:
              schema:
                type: string
              example: Method Not Allowed
        '500':
          description: Unexpected failure.
          content:
            text/plain:
              schema:
                type: string
              example: Internal Server Error

components:
  schemas:
    Transactions:
      type: object
      required:
        - user_id
        - type
        - amount
      properties:
        user_id:
          type: string
          format: uuid
        amount:
          type: integer
          minimum: 1
          description: Positive amount in minor currency units (e.g. 1050 = R$ 10,50 in centavos).
        type:
          type: string
          enum:
            - CREDIT
            - DEBIT
    TransactionsModel:
      type: object
      required:
        - id
        - user_id
        - type
        - amount
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        amount:
          type: integer
          description: Amount in minor currency units.
        type:
          type: string
          enum:
            - CREDIT
            - DEBIT
    BalanceResponse:
      type: object
      required:
        - amount
      properties:
        amount:
          type: integer
          description: Net balance in minor currency units (credits minus debits).

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
