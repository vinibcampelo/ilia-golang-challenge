services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transactions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transactions}
      POSTGRES_DB: ${POSTGRES_DB:-transactions}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata_transactions:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10

  ms-transactions:
    build:
      context: ../..
      dockerfile: services/ms-transactions/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3001}
      DATABASE_URL: postgres://${POSTGRES_USER:-transactions}:${POSTGRES_PASSWORD:-transactions}@postgres:5432/${POSTGRES_DB:-transactions}?sslmode=disable
      OPENAPI_SPEC: /app/ms-transactions.yaml
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"

volumes:
  pgdata_transactions:
