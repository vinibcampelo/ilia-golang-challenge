services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 3s
      timeout: 3s
      retries: 10

  ms-users:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3002}
      DATABASE_URL: postgres://users:users@postgres:5432/users?sslmode=disable
      OPENAPI_SPEC: /app/ms-users.yaml
    ports:
      - "${PORT:-3002}:${PORT:-3002}"

volumes:
  pgdata:
